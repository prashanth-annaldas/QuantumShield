version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qds_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qds_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-qds_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qds_user} -d ${POSTGRES_DB:-qds_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qds_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qds_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - APP_NAME=Quantum-Inspired Cyber Threat Detection (QDS-Framework)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-qds_user}:${POSTGRES_PASSWORD:-qds_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-qds_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-qds_production_secret_key_change_me_in_real_deployment_2026}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qds_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: qds_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - qds_network

volumes:
  postgres_data:
    name: qds_postgres_data

networks:
  qds_network:
    name: qds_framework_network
    driver: bridge
